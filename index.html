<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new task..." 
                autofocus
            >
            <button id="addBtn" class="btn btn-primary">Add Task</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="stats">
            <span>Total: <span id="totalCount">0</span></span>
            <span>Active: <span id="activeCount">0</span></span>
            <span>Completed: <span id="completedCount">0</span></span>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- To-dos will be added here -->
        </ul>

        <div class="actions">
            <button id="clearCompleted" class="btn btn-secondary">Clear Completed</button>
            <button id="clearAll" class="btn btn-danger">Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
